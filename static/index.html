              </div>
              <div style={{ display: 'flex', gap: 3 }}>
                {[['', 'All'], ['Large', 'Lg'], ['Mid', 'Mid'], ['Small', 'Sm']].map(([v, lbl]) => (
                  <button key={v} onClick={() => setFilters(p => ({ ...p, cap_tier: v }))}
                    style={{
                      flex: 1, padding: '4px 2px', borderRadius: 3, fontSize: 10, border: '1px solid #2a2a2a',
                      background: f.cap_tier === v ? '#f0a500' : '#1a1a1a', color: f.cap_tier === v ? '#000' : '#888'
                    }}>
                    {lbl}
                  </button>
                ))}
              </div>
            </div>
            {sectors.length > 0 && <div>
              <div style={{ fontSize: 10, color: '#666', marginBottom: 3 }}>Sector</div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 3 }}>
                {sectors.map(s => <button key={s}
                  onClick={() => setFilters(p => ({ ...p, sectors: p.sectors.includes(s) ? p.sectors.filter(x => x !== s) : [...p.sectors, s] }))}
                  style={{
                    padding: '2px 6px', borderRadius: 10, fontSize: 9, border: '1px solid #2a2a2a',
                    background: f.sectors.includes(s) ? '#f0a500' : '#1a1a1a',
                    color: f.sectors.includes(s) ? '#000' : '#777'
                  }}>
                  {s}
                </button>)}
              </div>
            </div>}
          </FilterSection>

          <FilterSection title="Fundamental" badge={countFund()}>
            <RangeRow label="P/E" tip={COL_TIPS.pe} minKey="pe_min" maxKey="pe_max" filters={f} setFilters={setFilters} />
            <RangeRow label="Fwd P/E" tip={COL_TIPS.fwd_pe} minKey="fwd_pe_min" maxKey="fwd_pe_max" filters={f} setFilters={setFilters} />
            <RangeRow label="EPS Growth %" tip={COL_TIPS.eps_grw} minKey="eps_grw_min" maxKey="eps_grw_max" filters={f} setFilters={setFilters} />
            <RangeRow label="Rev Growth %" tip={COL_TIPS.rev_grw} minKey="rev_grw_min" maxKey="rev_grw_max" filters={f} setFilters={setFilters} />
            <RangeRow label="Profit Margin %" tip={COL_TIPS.pm} minKey="pm_min" maxKey="pm_max" filters={f} setFilters={setFilters} />
            <RangeRow label="Debt/Equity" tip={COL_TIPS.debt_eq} minKey="debt_eq_min" maxKey="debt_eq_max" filters={f} setFilters={setFilters} step="0.01" />
            <div style={{ marginTop: 4 }}><Toggle checked={f.fcf_only} onChange={v => setFilters(p => ({ ...p, fcf_only: v }))} label="Free Cash Flow Positive" /></div>
          </FilterSection>

          <FilterSection title="Technical" badge={countTech()}>
            <RangeRow label="RSI" tip={COL_TIPS.rsi} minKey="rsi_min" maxKey="rsi_max" filters={f} setFilters={setFilters} step="1" />
            <div style={{ marginBottom: 6 }}>
              <div style={{ fontSize: 10, color: '#666', marginBottom: 3 }}><Tip label="MACD Signal" tip={COL_TIPS.macd_sig} /></div>
              <select value={f.macd} onChange={e => setFilters(p => ({ ...p, macd: e.target.value }))}>
                <option value="">Any</option><option value="bullish">Bullish</option>
                <option value="bearish">Bearish</option><option value="neutral">Neutral</option>
              </select>
            </div>
            <div style={{ marginBottom: 6 }}>
              <div style={{ fontSize: 10, color: '#666', marginBottom: 3 }}><Tip label="vs MA50" tip={COL_TIPS.vs_ma50} /></div>
              <select value={f.vs_ma50} onChange={e => setFilters(p => ({ ...p, vs_ma50: e.target.value }))}>
                <option value="">Any</option><option value="above">Above</option><option value="below">Below</option>
              </select>
            </div>
            <div style={{ marginBottom: 6 }}>
              <div style={{ fontSize: 10, color: '#666', marginBottom: 3 }}><Tip label="vs MA200" tip={COL_TIPS.vs_ma200} /></div>
              <select value={f.vs_ma200} onChange={e => setFilters(p => ({ ...p, vs_ma200: e.target.value }))}>
                <option value="">Any</option><option value="above">Above</option><option value="below">Below</option>
              </select>
            </div>
            <div style={{ display: 'flex', gap: 12, marginTop: 4 }}>
              <Toggle checked={f.gc} onChange={v => setFilters(p => ({ ...p, gc: v }))} label="Golden Cross" />
              <Toggle checked={f.dc} onChange={v => setFilters(p => ({ ...p, dc: v }))} label="Death Cross" />
            </div>
          </FilterSection>

          <FilterSection title="Momentum" badge={countMom()}>
            <RangeRow label="52W Position %" tip={COL_TIPS.p52w} minKey="p52w_min" maxKey="p52w_max" filters={f} setFilters={setFilters} step="1" />
            <div style={{ marginBottom: 6 }}>
              <div style={{ fontSize: 10, color: '#666', marginBottom: 3 }}><Tip label="Min Volume Ratio" tip={COL_TIPS.vol_r} /></div>
              <input type="number" placeholder="e.g. 1.5" step="0.1" value={f.vol_r_min}
                onChange={e => setFilters(p => ({ ...p, vol_r_min: e.target.value }))} style={{ width: '100%' }} />
            </div>
            <div style={{ marginBottom: 6 }}>
              <div style={{ fontSize: 10, color: '#666', marginBottom: 3 }}>Gain Sharpe</div>
              <input type="number" placeholder="e.g. 1.5" step="0.1" value={f.gain_sharpe_min}
                onChange={e => setFilters(p => ({ ...p, gain_sharpe_min: e.target.value }))} style={{ width: '100%' }} />
            </div>
            <div style={{ marginBottom: 6 }}>
              <div style={{ fontSize: 10, color: '#666', marginBottom: 3 }}>Max Volatility</div>
              <input type="number" placeholder="e.g. 0.3" step="any" value={f.vol_max}
                onChange={e => setFilters(p => ({ ...p, vol_max: e.target.value }))} style={{ width: '100%' }} />
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginTop: 4 }}>
              <Toggle checked={f.earn_beat} onChange={v => setFilters(p => ({ ...p, earn_beat: v }))} label="Earnings Beat" />
              <Toggle checked={f.earn_soon} onChange={v => setFilters(p => ({ ...p, earn_soon: v }))} label="Earnings Soon" />
            </div>
          </FilterSection>

          <FilterSection title="Portfolio" badge={countPort()}>
            <RangeRow label="Beta" tip={COL_TIPS.beta} minKey="beta_min" maxKey="beta_max" filters={f} setFilters={setFilters} step="0.1" />
            <RangeRow label="Dividend Yield %" tip={COL_TIPS.div} minKey="div_min" maxKey="div_max" filters={f} setFilters={setFilters} step="0.1" />
          </FilterSection>

          <FilterSection title="Score" badge={countScore()}>
            {[['score_min', 'Overall', COL_TIPS.score], ['score_f_min', 'Fundamental', COL_TIPS.score_f],
            ['score_t_min', 'Technical', COL_TIPS.score_t], ['score_m_min', 'Momentum', COL_TIPS.score_m]].map(([key, label, tip]) => (
              <div key={key} style={{ marginBottom: 6 }}>
                <div style={{ fontSize: 10, color: '#666', marginBottom: 3 }}><Tip label={label + ' min'} tip={tip} /></div>
                <div style={{ display: 'flex', gap: 3 }}>
                  {[0, 1, 2, 3, 4, 5].map(v => (
                    <button key={v} onClick={() => setFilters(p => ({ ...p, [key]: p[key] === v ? '' : v }))}
                      style={{
                        flex: 1, padding: '3px 0', borderRadius: 3, fontSize: 11, border: '1px solid #2a2a2a',
                        background: f[key] === v ? '#f0a500' : '#1a1a1a', color: f[key] === v ? '#000' : '#666'
                      }}>
                      {v}
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </FilterSection>

        </div>
      </div>;
    }

    /* ── Toolbar ── */
    function Toolbar({ filters, setFilters, results, heatMode, setHeatMode,
      showPortfolio, setShowPortfolio, showWatchlist, setShowWatchlist,
      showCompare, setShowCompare,
      visibleCols, setVisibleCols, onShowSave, onRefresh, loading }) {
      const [showPresets, setShowPresets] = useState(false);
      const [showCols, setShowCols] = useState(false);
      const [dragCol, setDragCol] = useState(null);
      const activeCount = useMemo(() => {
        const f = filters;
        return [f.pe_min, f.pe_max, f.fwd_pe_min, f.fwd_pe_max, f.eps_grw_min, f.eps_grw_max,
        f.rev_grw_min, f.rev_grw_max, f.pm_min, f.pm_max, f.debt_eq_min, f.debt_eq_max,
        f.rsi_min, f.rsi_max, f.macd, f.vs_ma200, f.vs_ma50, f.vol_r_min, f.p52w_min, f.p52w_max, f.gain_sharpe_min, f.vol_max,
        f.beta_min, f.beta_max, f.div_min, f.div_max, f.asset_type, f.cap_tier,
        f.score_min, f.score_f_min, f.score_t_min, f.score_m_min, ...f.sectors]
          .filter(v => v !== '' && v !== false && v != null).length +
          (f.fcf_only ? 1 : 0) + (f.gc ? 1 : 0) + (f.dc ? 1 : 0) + (f.earn_beat ? 1 : 0) + (f.earn_soon ? 1 : 0);
      }, [filters]);
      const exportCSV = () => {
        if (!results.length) return;
        const hdr = visibleCols.map(k => { const c = ALL_COLS.find(x => x.k === k); return c?.label || k; });
        const rows = results.map(s => visibleCols.map(k => {
          if (k === 'score') return s.score?.o ?? '';
          if (k === 'score_f') return s.score?.f ?? '';
          if (k === 'score_t') return s.score?.t ?? '';
          if (k === 'score_m') return s.score?.m ?? '';
          if (k === 'spark') return s.spark ? s.spark[s.spark.length - 1] ?? '' : '';
          return s[k] ?? '';
        }));
        const csv = [hdr, ...rows].map(r => r.join(',')).join('\n');
        const a = document.createElement('a');
        a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
        a.download = `screener_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
      };
      const handleDrop = (k) => {
        if (!dragCol || dragCol === k) return;
        setVisibleCols(cols => {
          const arr = [...cols]; const fi = arr.indexOf(dragCol), ti = arr.indexOf(k);
          if (fi < 0 || ti < 0) return cols; arr.splice(fi, 1); arr.splice(ti, 0, dragCol); return arr;
        }); setDragCol(null);
      };
      return <div style={{
        height: 40, background: '#0d0d0d', borderBottom: '1px solid #1a1a1a',
        display: 'flex', alignItems: 'center', padding: '0 12px', gap: 6, flexShrink: 0
      }}>
        <div style={{ position: 'relative' }}>
          <button onClick={() => setShowPresets(s => !s)}
            style={{ background: '#1a1a1a', color: '#aaa', padding: '5px 10px', borderRadius: 3, fontSize: 11, border: '1px solid #2a2a2a' }}>
            Presets ▾
          </button>
          {showPresets && <div style={{ position: 'absolute', top: '100%', left: 0, zIndex: 100, background: '#161616', border: '1px solid #2a2a2a', borderRadius: 4, minWidth: 160, marginTop: 2 }}>
            {PRESETS.map(p => <div key={p.name} onClick={() => { setFilters(() => ({ ...defFilters(), ...p.f })); setShowPresets(false); }}
              style={{ padding: '7px 12px', cursor: 'pointer', fontSize: 12, color: '#aaa', borderBottom: '1px solid #1a1a1a' }}
              onMouseOver={e => e.currentTarget.style.color = '#f0a500'} onMouseOut={e => e.currentTarget.style.color = '#aaa'}>
              {p.name}
            </div>)}
            <div onClick={() => { setFilters(defFilters()); setShowPresets(false); }}
              style={{ padding: '7px 12px', cursor: 'pointer', fontSize: 12, color: '#555', borderTop: '1px solid #1a1a1a' }}
              onMouseOver={e => e.currentTarget.style.color = '#ff4d4d'} onMouseOut={e => e.currentTarget.style.color = '#555'}>
              Clear All
            </div>
          </div>}
        </div>
        <button onClick={() => setFilters(defFilters())} style={{ background: '#1a1a1a', color: '#ff4d4d', padding: '5px 10px', borderRadius: 3, fontSize: 11, border: '1px solid #2a2a2a' }}>
          Reset All
        </button>
        <button onClick={onShowSave} style={{ background: '#1a1a1a', color: '#aaa', padding: '5px 10px', borderRadius: 3, fontSize: 11, border: '1px solid #2a2a2a' }}>
          Save ⭐
        </button>
        {activeCount > 0 && <span style={{ background: '#f0a500', color: '#000', fontSize: 9, fontWeight: 700, padding: '1px 6px', borderRadius: 8 }}>
          {activeCount} filter{activeCount !== 1 ? 's' : ''}
        </span>}
        <div style={{ flex: 1 }} />
        <span style={{ fontSize: 11, color: '#444' }}>{results.length} results</span>
        <button onClick={onRefresh} disabled={loading}
          style={{ background: '#1a1a1a', color: loading ? '#555' : '#aaa', padding: '5px 10px', borderRadius: 3, fontSize: 11, border: '1px solid #2a2a2a' }}>
          {loading ? 'Loading…' : '↻ Refresh'}
        </button>
        <button onClick={exportCSV} style={{ background: '#1a1a1a', color: '#aaa', padding: '5px 10px', borderRadius: 3, fontSize: 11, border: '1px solid #2a2a2a' }}>
          CSV ↓
        </button>
        <button onClick={() => setShowWatchlist(s => !s)}
          style={{
            background: showWatchlist ? '#1a2a1a' : '#1a1a1a', color: showWatchlist ? '#00d26a' : '#aaa',
            padding: '5px 10px', borderRadius: 3, fontSize: 11, border: '1px solid #2a2a2a'
          }}>
          ★ Watchlist
        </button>
        <button onClick={() => setShowPortfolio(s => !s)}
          style={{
            background: showPortfolio ? '#f0a500' : '#1a1a1a', color: showPortfolio ? '#000' : '#aaa',
            padding: '5px 10px', borderRadius: 3, fontSize: 11, border: '1px solid #2a2a2a'
          }}>
          Portfolio
        </button>
        <button onClick={() => setShowCompare(s => !s)}
          style={{
            background: showCompare ? '#1a2030' : '#1a1a1a', color: showCompare ? '#3b9eff' : '#aaa',
            padding: '5px 10px', borderRadius: 3, fontSize: 11, border: '1px solid #2a2a2a'
          }}>
          Compare
        </button>
        <button onClick={() => setHeatMode(h => !h)}
          style={{
            background: heatMode ? '#1a2a1a' : '#1a1a1a', color: heatMode ? '#00d26a' : '#aaa',
            padding: '5px 10px', borderRadius: 3, fontSize: 11, border: '1px solid #2a2a2a'
          }}>
          Heat
        </button>
        <div style={{ position: 'relative' }}>
          <button onClick={() => setShowCols(s => !s)}
            style={{ background: '#1a1a1a', color: '#aaa', padding: '5px 10px', borderRadius: 3, fontSize: 11, border: '1px solid #2a2a2a' }}>
            Cols ⚙
          </button>
          {showCols && <div style={{
            position: 'absolute', top: '100%', right: 0, zIndex: 100, background: '#161616',
            border: '1px solid #2a2a2a', borderRadius: 4, width: 200, maxHeight: 340, overflow: 'auto', marginTop: 2, padding: 8
          }}>
            <div style={{ fontSize: 10, color: '#555', marginBottom: 6, textTransform: 'uppercase', letterSpacing: .5 }}>
              Drag to reorder · click to toggle
            </div>
            {[...visibleCols.map(k => ALL_COLS.find(c => c.k === k)).filter(Boolean),
               ...ALL_COLS.filter(c => !visibleCols.includes(c.k))].map(col => {
              const on = visibleCols.includes(col.k);
              return <div key={col.k} draggable onDragStart={() => setDragCol(col.k)}
                onDragOver={e => e.preventDefault()} onDrop={() => handleDrop(col.k)}
                onClick={() => setVisibleCols(v => on ? v.filter(x => x !== col.k) : [...v, col.k])}
                title={COL_TIPS[col.k] || ''}
                style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '4px 6px', cursor: 'pointer', borderRadius: 3, userSelect: 'none' }}>
                <span style={{
                  width: 12, height: 12, borderRadius: 2, background: on ? '#f0a500' : '#1a1a1a',
                  border: '1px solid #2a2a2a', flexShrink: 0
                }} />
                <span style={{ fontSize: 11, color: on ? '#c8c8c8' : '#555' }}>{col.label}</span>
                <span style={{ marginLeft: 'auto', color: '#333', fontSize: 11 }}>⠿</span>
              </div>;
            })}
            <div style={{ marginTop: 6, paddingTop: 6, borderTop: '1px solid #1a1a1a', display: 'flex', gap: 4 }}>
              <button onClick={() => setVisibleCols([...DEFAULT_COLS])}
                style={{ flex: 1, background: '#1a1a1a', color: '#888', padding: '4px', borderRadius: 3, fontSize: 10 }}>Reset</button>
              <button onClick={() => setVisibleCols(ALL_COLS.map(c => c.k))}
                style={{ flex: 1, background: '#1a1a1a', color: '#888', padding: '4px', borderRadius: 3, fontSize: 10 }}>All</button>
            </div>
          </div>}
        </div>
      </div>;
    }

    /* ── Results Table ── */
    function ResultsTable({ results, loading, heatMode, onSelect, sortKey, sortDir, onSort, visibleCols, watchlistSet }) {
      const cols = visibleCols.map(k => ALL_COLS.find(c => c.k === k)).filter(Boolean);
      const renderCell = (s, k) => {
        switch (k) {
          case 'ticker': return <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
            <span className="mono" style={{ fontWeight: 700, color: '#f0a500' }}>{s.ticker}</span>
            {watchlistSet.has(s.ticker) && <span title="In watchlist" style={{ color: '#00d26a', fontSize: 10 }}>★</span>}
          </div>;
          case 'name': return <span style={{
            color: '#888', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
            maxWidth: 150, display: 'block'
          }} title={s.name}>{s.name}</span>;
          case 'spark': return <Sparkline data={s.spark} width={27} height={26} />;
          case 'price': return s.price != null ?
            <span className="mono" style={{
              background: heatMode ? heatColor(s.chg_pct) : 'transparent',
              padding: heatMode ? '1px 4px' : '0', borderRadius: 2
            }}>${fmt2(s.price)}</span> : '—';
          case 'chg_pct': return s.chg_pct != null ? <span className="mono" style={{ color: clr(s.chg_pct) }}>{fmtPct(s.chg_pct)}</span> : '—';
          case 'mkt_cap': return <span className="mono">{fmtB(s.mkt_cap)}</span>;
          case 'pe': return <span className="mono">{fmt2(s.pe)}</span>;
          case 'fwd_pe': return <span className="mono">{fmt2(s.fwd_pe)}</span>;
          case 'eps_grw': return s.eps_grw != null ? <span className="mono" style={{ color: clr(s.eps_grw) }}>{fmtPct(s.eps_grw)}</span> : '—';
          case 'rev_grw': return s.rev_grw != null ? <span className="mono" style={{ color: clr(s.rev_grw) }}>{fmtPct(s.rev_grw)}</span> : '—';
          case 'pm': return s.pm != null ? <span className="mono" style={{ color: clr(s.pm) }}>{s.pm}%</span> : '—';
          case 'debt_eq': return <span className="mono">{fmt2(s.debt_eq)}</span>;
          case 'rsi': {
            const c = s.rsi == null ? '#888' : s.rsi > 70 ? '#ff4d4d' : s.rsi < 30 ? '#00d26a' : '#c8c8c8';
            return s.rsi != null ? <span className="mono" style={{ color: c }}>{fmt1(s.rsi)}</span> : '—';
          }
          case 'macd_sig': {
            const c = s.macd_sig === 'bullish' ? '#00d26a' : s.macd_sig === 'bearish' ? '#ff4d4d' : '#888';
            return <span style={{ color: c, fontSize: 10 }}>{s.macd_sig || '—'}</span>;
          }
          case 'vs_ma50': return s.vs_ma50 != null ? <span className="mono" style={{ color: clr(s.vs_ma50) }}>{fmtPct(s.vs_ma50)}</span> : '—';
          case 'vs_ma200': return s.vs_ma200 != null ? <span className="mono" style={{ color: clr(s.vs_ma200) }}>{fmtPct(s.vs_ma200)}</span> : '—';
          case 'p52w': return s.p52w != null ? <span className="mono">{s.p52w}%</span> : '—';
          case 'vol_r': return s.vol_r != null ? <span className="mono" style={{ color: s.vol_r > 1.5 ? '#f0a500' : s.vol_r < 0.7 ? '#555' : '#c8c8c8' }}>{fmt2(s.vol_r)}×</span> : '—';
          case 'beta': return <span className="mono">{fmt2(s.beta)}</span>;
          case 'div': return s.div != null ? <span className="mono" style={{ color: '#00d26a' }}>{s.div}%</span> : '—';
          case 'ann_ret': return s.ann_ret != null ? <span className="mono" style={{ color: clr(s.ann_ret) }}>{fmtPct(s.ann_ret)}</span> : '—';
          case 'sharpe': return s.sharpe != null ? <span className="mono" style={{ color: s.sharpe > 1 ? '#00d26a' : s.sharpe < 0 ? '#ff4d4d' : '#c8c8c8' }}>{fmt2(s.sharpe)}</span> : '—';
          case 'score_f': return <ScoreDots val={s.score?.f || 0} color="#f0a500" />;
          case 'score_t': return <ScoreDots val={s.score?.t || 0} color="#5ba3ff" />;
          case 'score_m': return <ScoreDots val={s.score?.m || 0} color="#00c48c" />;
          case 'score': return <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
            <ScoreDots val={s.score?.o || 0} color="#f0a500" />
            <span className="mono" style={{ fontSize: 10, color: '#555' }}>{s.score?.o ?? '—'}</span>
          </div>;
          case 'vol_1m': return s.vol_1m != null ? <span className="mono" style={{ color: s.vol_1m > 40 ? '#ff4d4d' : s.vol_1m < 20 ? '#00d26a' : '#c8c8c8' }}>{s.vol_1m.toFixed(1)}%</span> : '—';
          case 'max_dd_1m': return s.max_dd_1m != null ? <span className="mono" style={{ color: s.max_dd_1m > 10 ? '#ff4d4d' : s.max_dd_1m < 3 ? '#00d26a' : '#c8c8c8' }}>-{s.max_dd_1m.toFixed(1)}%</span> : '—';
          default: return s[k] != null ? <span className="mono">{s[k]}</span> : '—';
        }
      };
      return <div style={{ flex: 1, overflow: 'auto', position: 'relative', minHeight: 0 }}>
        {loading && <div style={{
          position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, background: '#0d0d0d99',
          display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 10
        }}>
          <span style={{ color: '#f0a500', fontSize: 12 }}>Loading…</span>
        </div>}
        <table style={{ width: 'max-content', borderCollapse: 'collapse', fontSize: 12 }}>
          <thead style={{ position: 'sticky', top: 0, zIndex: 5, background: '#0d0d0d' }}>
            <tr>
              {cols.map(col => (
                <th key={col.k} onClick={() => onSort(col.k)}
                  style={{
                    padding: '7px 8px', textAlign: 'left', borderBottom: '1px solid #1a1a1a',
                    cursor: 'pointer', whiteSpace: 'nowrap', color: sortKey === col.k ? '#f0a500' : '#555',
                    fontSize: 10, fontWeight: 600, letterSpacing: .4, textTransform: 'uppercase',
                    minWidth: col.w, width: col.w, userSelect: 'none'
                  }}>
                  <Tip label={col.label + (sortKey === col.k ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '')} tip={COL_TIPS[col.k]} />
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {results.length === 0 && !loading && <tr>
              <td colSpan={cols.length} style={{ padding: '40px 16px', color: '#444', textAlign: 'center' }}>
                No results. Data is loading in the background — check the progress bar in the header.
              </td>
            </tr>}
            {results.map((s, ri) => (
              <tr key={s.ticker} onClick={() => onSelect(s)}
                style={{
                  cursor: 'pointer', borderBottom: '1px solid #161616',
                  background: ri % 2 === 0 ? 'transparent' : '#0a0a0a'
                }}
                onMouseOver={e => e.currentTarget.style.background = '#141414'}
                onMouseOut={e => e.currentTarget.style.background = ri % 2 === 0 ? 'transparent' : '#0a0a0a'}>
                {cols.map(col => (
                  <td key={col.k} style={{ padding: '5px 8px', whiteSpace: 'nowrap', verticalAlign: 'middle' }}>
                    {renderCell(s, col.k)}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>;
    }

    /* ══ Main App ══ */
    function App() {
      const [user, setUser] = useState(null);
      const [watchlist, setWatchlist] = useState([]);
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(false);
      const [filters, setFilters] = useState(defFilters());
      const [sortKey, setSortKey] = useState('score');
      const [sortDir, setSortDir] = useState('desc');
      const [selected, setSelected] = useState(null);
      const [selectedHistory, setSelectedHistory] = useState(null);
      const [selectedIndicators, setSelectedIndicators] = useState(null);
      const [heatMode, setHeatMode] = useState(false);
      const [showPortfolio, setShowPortfolio] = useState(false);
      const [showWatchlist, setShowWatchlist] = useState(false);
      const [showCompare, setShowCompare] = useState(false);
      const [showSave, setShowSave] = useState(false);
      const [visibleCols, setVisibleCols] = useState(DEFAULT_COLS);
      const [sectors, setSectors] = useState([]);
      const [universeStatus, setUniverseStatus] = useState(null);
      const [rateLimitExceeded, setRateLimitExceeded] = useState(false);
      const [spyHistory, setSpyHistory] = useState(null);
      const [spyIndicators, setSpyIndicators] = useState(null);
      const filtersRef = useRef(filters);
      const loadGen = useRef(0);

      useEffect(() => { filtersRef.current = filters; }, [filters]);

      /* Load user */
      useEffect(() => {
        (async () => {
          if (!getToken()) { location.href = '/login'; return; }
          const r = await apiFetch('/auth/me');
          if (!r.ok) { clearToken(); location.href = '/login'; return; }
          setUser(await r.json());
        })();
      }, []);

      /* Load watchlist */
      const loadWatchlist = useCallback(async () => {
        const r = await apiFetch('/api/watchlist');
        if (r.ok) {
          const data = await r.json();
          setWatchlist(data.map(i => i.ticker || i));
        }
      }, []);
      useEffect(() => { if (user) loadWatchlist(); }, [user]);

      /* Screener */
      const loadScreener = useCallback(async (f, force = false) => {
        if (force && rateLimitExceeded) {
          alert("Hourly yfinance API rate limit (2000) reached. Further queries are temporarily disabled to prevent blocking.");
          return;
        }

        const gen = ++loadGen.current;
        setLoading(true);
        try {
          const body = { ...f, force_refresh: force };
          Object.keys(body).forEach(k => { if (body[k] === '') body[k] = null; });
          const r = await apiFetch('/api/screener', { method: 'POST', body: JSON.stringify(body) });
          if (gen !== loadGen.current) return;
          if (r.ok) {
            const data = await r.json();
            const list = data.results || [];
            if (data.rate_limit_exceeded) setRateLimitExceeded(true);
            setSectors([...new Set(list.map(s => s.sector).filter(Boolean))].sort());
            setResults(list);
            if (data.universe) setUniverseStatus(data.universe);
          }
        } catch (e) { }
        if (gen === loadGen.current) setLoading(false);
      }, [rateLimitExceeded]);

      /* Poll universe status while loading */
      useEffect(() => {
        if (!user) return;
        const poll = async () => {
          const r = await apiFetch('/api/screener/universe/status');
          if (r.ok) {
            const s = await r.json();
            setUniverseStatus(s);
            if (s.rate_limit && s.rate_limit.used >= s.rate_limit.limit) setRateLimitExceeded(true);

            if (s.loaded < s.total && !rateLimitExceeded) loadScreener(filtersRef.current, false);
          }
        };
        const id = setInterval(poll, 10000); // every 10s while loading
        return () => clearInterval(id);
      }, [user, loadScreener]);

      /* Trigger screener on filter/user change */
      useEffect(() => {
        if (user) loadScreener(filtersRef.current, false);
      }, [filters, user]);

      /* Fetch SPY baseline once on load */
      useEffect(() => {
        if (!user) return;
        apiFetch('/api/stocks/SPY/history').then(r => r.ok && r.json()).then(d => {
          if (d) { setSpyHistory(d.bars); setSpyIndicators(d.indicators); }
        }).catch(() => { });
      }, [user]);

      /* Watchlist toggle */
      const toggleWatchlist = useCallback(async (ticker) => {
        if (watchlist.includes(ticker)) {
          await apiFetch(`/api/watchlist/${ticker}`, { method: 'DELETE' });
        } else {
          await apiFetch('/api/watchlist', { method: 'POST', body: JSON.stringify({ ticker }) });
        }
        loadWatchlist();
      }, [watchlist, loadWatchlist]);

      /* Add to watchlist */
      const addToWatchlist = useCallback(async (ticker) => {
        await apiFetch('/api/watchlist', { method: 'POST', body: JSON.stringify({ ticker }) });
        loadWatchlist();
      }, [loadWatchlist]);

      /* Remove from watchlist */
      const removeFromWatchlist = useCallback(async (ticker) => {
        await apiFetch(`/api/watchlist/${ticker}`, { method: 'DELETE' });
        loadWatchlist();
      }, [loadWatchlist]);

      /* Sort */
      const handleSort = useCallback((k) => {
        setSortDir(prev => sortKey === k ? (prev === 'asc' ? 'desc' : 'asc') : 'desc');
        setSortKey(k);
      }, [sortKey]);

      const sortedResults = useMemo(() => [...results].sort((a, b) => {
        let av, bv;
        if (sortKey === 'score') { av = a.score?.o ?? -1; bv = b.score?.o ?? -1; }
        else if (sortKey === 'score_f') { av = a.score?.f ?? -1; bv = b.score?.f ?? -1; }
        else if (sortKey === 'score_t') { av = a.score?.t ?? -1; bv = b.score?.t ?? -1; }
        else if (sortKey === 'score_m') { av = a.score?.m ?? -1; bv = b.score?.m ?? -1; }
        else { av = a[sortKey] ?? -Infinity; bv = b[sortKey] ?? -Infinity; }
        if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
        return sortDir === 'asc' ? av - bv : bv - av;
      }), [results, sortKey, sortDir]);

      const watchlistSet = useMemo(() => new Set(watchlist), [watchlist]);

      /* Select stock */
      const handleSelect = useCallback(async (s) => {
        setSelected(s); setSelectedHistory(null); setSelectedIndicators(null);
        const r = await apiFetch(`/api/stocks/${s.ticker}/history`);
        if (r.ok) { const d = await r.json(); setSelectedHistory(d.bars); setSelectedIndicators(d.indicators); }
      }, []);

      if (!user) return <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        height: '100%', color: '#f0a500', fontFamily: "'JetBrains Mono',monospace"
      }}>Loading…</div>;

      return <div style={{ display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' }}>
        <Header user={user} universeStatus={universeStatus} onLogout={() => { clearToken(); location.href = '/login'; }} />
        <Toolbar
          filters={filters} setFilters={setFilters} results={sortedResults}
          heatMode={heatMode} setHeatMode={setHeatMode}
          showPortfolio={showPortfolio} setShowPortfolio={setShowPortfolio}
          showWatchlist={showWatchlist} setShowWatchlist={setShowWatchlist}
          showCompare={showCompare} setShowCompare={setShowCompare}
          visibleCols={visibleCols} setVisibleCols={setVisibleCols}
          onShowSave={() => setShowSave(true)}
          onRefresh={() => loadScreener(filtersRef.current, true)}
          loading={loading} />
        <div style={{ flex: 1, display: 'flex', overflow: 'hidden', position: 'relative' }}>
          <Sidebar filters={filters} setFilters={setFilters} sectors={sectors} />
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', position: 'relative' }}>
            <ResultsTable
              results={sortedResults} loading={loading} heatMode={heatMode}
              onSelect={handleSelect} sortKey={sortKey} sortDir={sortDir}
              onSort={handleSort} visibleCols={visibleCols} watchlistSet={watchlistSet} />
          </div>
          {selected && <StockDetail
            stock={selected} history={selectedHistory} indicators={selectedIndicators}
            spyHistory={spyHistory} spyIndicators={spyIndicators}
            onClose={() => setSelected(null)} heatMode={heatMode}
            isWatchlisted={watchlistSet.has(selected.ticker)}
            onToggleWatchlist={() => toggleWatchlist(selected.ticker)} />}
          {showPortfolio && <PortfolioPanel onClose={() => setShowPortfolio(false)} />}
          {showCompare && <ComparePanel watchlist={watchlist} onClose={() => setShowCompare(false)} />}
          {showWatchlist && <WatchlistPanel watchlist={watchlist} onClose={() => setShowWatchlist(false)}
            onAdd={addToWatchlist} onRemove={removeFromWatchlist} />}
        </div>
        {showSave && <SaveModal filters={filters} onClose={(lf) => { setShowSave(false); if (lf) setFilters({ ...defFilters(), ...lf }); }} />}
      </div>;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
