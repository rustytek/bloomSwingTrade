<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwingTrader — Trade Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background:#0d0d0d; color:#d8d8d8; font-family:'Inter',sans-serif; font-size:14px; line-height:1.5; }
    .topbar { min-height:44px; background:#111; border-bottom:1px solid #1a1a1a; display:flex; align-items:center; padding:0 16px; gap:12px; position:sticky; top:0; z-index:10; flex-wrap:wrap; }
    .brand { font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; color:#fff; letter-spacing:1px; text-decoration:none; white-space:nowrap; }
    .topbar-sep { width:1px; height:20px; background:#222; flex-shrink:0; }
    .universe-status { display:flex; align-items:center; gap:6px; min-width:0; }
    .universe-text { font-size:11px; color:#444; white-space:nowrap; }
    .universe-text.loading { color:#f0a500; }
    .data-time { font-size:10px; color:#555; margin-left:8px; }
    .topbar-actions { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .username { font-size:11px; color:#555; }
    .btn { display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:3px; border:1px solid #2a2a2a; background:#1a1a1a; color:#999; font-size:11px; font-weight:600; cursor:pointer; text-decoration:none; font-family:'Inter',sans-serif; }
    .btn:hover { color:#ddd; background:#222; }
    .btn-active { color:#f0a500; border-color:#3a2f10; background:#1c1810; }
    .btn-sm { padding:3px 8px; font-size:10px; }
    .hint { position:relative; }
    .hint::after { content:attr(data-tip); position:absolute; left:50%; bottom:calc(100% + 9px); transform:translateX(-50%); display:none; width:min(280px,70vw); padding:8px 10px; background:#1e1e1e; border:1px solid #333; border-radius:4px; color:#d8d8d8; font-size:11px; font-weight:400; line-height:1.45; white-space:normal; box-shadow:0 6px 18px #000c; z-index:200; pointer-events:none; }
    .hint:hover::after, .hint:focus-within::after { display:block; }
    .topbar .hint::after { top:calc(100% + 9px); bottom:auto; }
    .page { max-width:1400px; margin:0 auto; padding:18px; display:flex; flex-direction:column; gap:16px; }
    .mono { font-family:'JetBrains Mono',monospace; }
    .muted { color:#777; } .up { color:#26a65b; } .down { color:#e05252; } .warn { color:#f0a500; }
    .ticker-link { color:#f0a500; cursor:pointer; font-family:'JetBrains Mono',monospace; font-weight:700; }
    .ticker-link:hover { text-decoration:underline; }
    .panel { background:#111; border:1px solid #1e1e1e; border-radius:6px; padding:16px; }
    .panel-title { font-size:13px; color:#ccc; font-weight:700; margin-bottom:12px; text-transform:uppercase; letter-spacing:.05em; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
    .stat { background:#141414; border:1px solid #1f1f1f; border-radius:6px; padding:12px 14px; }
    .stat-label { font-size:11px; color:#777; text-transform:uppercase; letter-spacing:.06em; }
    .stat-value { font:700 22px 'JetBrains Mono',monospace; color:#eee; margin-top:3px; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th { text-align:left; padding:7px 8px; color:#666; border-bottom:1px solid #222; font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
    td { padding:8px; border-bottom:1px solid #171717; vertical-align:middle; }
    tr:hover td { background:#151515; }
    .strat-badge { display:inline-flex; padding:2px 7px; border-radius:3px; font-size:10px; font-weight:700; background:#15131f; color:#b69cff; border:1px solid #2c2546; }
    .modal { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
    .modal-card { width:min(980px,96vw); max-height:88vh; overflow:auto; background:#111; border:1px solid #2a2a2a; border-radius:6px; box-shadow:0 18px 60px #000; }
    .modal-head { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid #1e1e1e; position:sticky; top:0; background:#111; }
    .modal-body { padding:16px; display:grid; grid-template-columns:1.2fr .8fr; gap:16px; }
    .chart-wrap { height:300px; }
    .icon-btn { margin-left:auto; background:#1a1a1a; color:#888; border:1px solid #2a2a2a; border-radius:4px; padding:4px 10px; cursor:pointer; }
    .empty { color:#666; font-size:12px; padding:14px; text-align:center; }
    .error { color:#e05252; font-size:12px; }
    @media (max-width:900px){ .modal-body{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="topbar" id="topbar"></div>
  <main class="page">
    <div id="loading" class="empty">Loading journal…</div>
    <section id="statsWrap" class="panel" hidden></section>
    <section id="equityWrap" class="panel" hidden></section>
    <section id="strategyWrap" class="panel" hidden></section>
    <section id="tradesWrap" class="panel" hidden></section>
  </main>

  <script src="/static/js/common.js"></script>
  <script>
  'use strict';
  function rcell(v) { return v == null ? '<span class="muted">--</span>' : `<span class="${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '+' : ''}${v}R</span>`; }

  async function load() {
    let d;
    try { d = await api('/api/journal'); }
    catch (e) { document.getElementById('loading').innerHTML = `<span class="error">${esc(e.message)}</span>`; return; }
    document.getElementById('loading').hidden = true;
    renderStats(d.stats);
    renderEquity(d.equity_curve);
    renderStrategy(d.by_strategy);
    renderTrades(d.trades);
  }

  let _eqChart = null;
  function renderEquity(curve) {
    const wrap = document.getElementById('equityWrap');
    if (!curve || curve.length < 1) { wrap.hidden = true; return; }
    wrap.hidden = false;
    const last = curve[curve.length - 1].cum_pnl;
    const up = last >= 0;
    wrap.innerHTML = `<div class="panel-title">Cumulative Realized P&amp;L
      <span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0;">— running total of closed-trade profit/loss over time (${curve.length} trades, now ${up ? '+' : ''}${fmtMoney(last)})</span></div>
      <div class="chart-wrap"><canvas id="eqChart"></canvas></div>`;
    _eqChart?.destroy();
    _eqChart = new Chart(document.getElementById('eqChart'), {
      type: 'line',
      data: {
        labels: curve.map(p => p.date),
        datasets: [{
          label: 'Cumulative P&L ($)',
          data: curve.map(p => p.cum_pnl),
          borderColor: up ? '#26a65b' : '#e05252',
          backgroundColor: up ? 'rgba(38,166,91,.08)' : 'rgba(224,82,82,.08)',
          fill: true, tension: .15, pointRadius: curve.length > 40 ? 0 : 2,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: c => ' ' + fmtMoney(c.parsed.y), title: items => curve[items[0].dataIndex]?.ticker ? `${curve[items[0].dataIndex].date} · ${curve[items[0].dataIndex].ticker}` : items[0].label } },
        },
        scales: {
          x: { ticks: { color: '#777', maxTicksLimit: 8 }, grid: { color: '#1a1a1a' } },
          y: { ticks: { color: '#777', callback: v => '$' + v }, grid: { color: '#1a1a1a' } },
        },
      },
    });
  }

  function renderStats(s) {
    const wrap = document.getElementById('statsWrap'); wrap.hidden = false;
    const cards = [
      ['Closed Trades', s.count ?? 0],
      ['Win Rate', s.win_rate != null ? s.win_rate + '%' : '--'],
      ['Avg R', s.avg_r != null ? (s.avg_r >= 0 ? '+' : '') + s.avg_r + 'R' : '--'],
      ['Expectancy', s.expectancy_r != null ? (s.expectancy_r >= 0 ? '+' : '') + s.expectancy_r + 'R' : '--'],
      ['Total P&L', s.total_pnl != null ? fmtMoney(s.total_pnl) : '--'],
      ['Avg Win', s.avg_win_pct != null ? '+' + s.avg_win_pct + '%' : '--'],
      ['Avg Loss', s.avg_loss_pct != null ? s.avg_loss_pct + '%' : '--'],
    ];
    wrap.innerHTML = `<div class="panel-title">Performance</div><div class="stats">${cards.map(([l, v]) => `<div class="stat"><div class="stat-label">${esc(l)}</div><div class="stat-value">${v}</div></div>`).join('')}</div>`;
  }

  function renderStrategy(by) {
    const wrap = document.getElementById('strategyWrap');
    const keys = Object.keys(by || {});
    if (!keys.length) { wrap.hidden = true; return; }
    wrap.hidden = false;
    wrap.innerHTML = `<div class="panel-title">By Strategy</div>
      <table><thead><tr><th>Strategy</th><th>Trades</th><th>Win Rate</th><th>Avg R</th><th>Total P&L</th></tr></thead><tbody>
      ${keys.map(k => { const s = by[k]; return `<tr>
        <td><span class="strat-badge">${esc(k)}</span></td>
        <td class="mono">${s.count}</td>
        <td class="mono">${s.win_rate != null ? s.win_rate + '%' : '--'}</td>
        <td class="mono">${s.avg_r != null ? (s.avg_r >= 0 ? '+' : '') + s.avg_r + 'R' : '--'}</td>
        <td class="mono">${fmtMoney(s.total_pnl)}</td></tr>`; }).join('')}
      </tbody></table>`;
  }

  function renderTrades(trades) {
    const wrap = document.getElementById('tradesWrap'); wrap.hidden = false;
    if (!trades.length) {
      wrap.innerHTML = `<div class="panel-title">Closed Trades</div><div class="empty">No closed trades yet. When you close a position from the <a class="ticker-link" href="/">Today</a> page, it lands here.</div>`;
      return;
    }
    wrap.innerHTML = `<div class="panel-title">Closed Trades</div>
      <table><thead><tr><th>Ticker</th><th>Strategy</th><th>Entry→Exit</th><th>Shares</th><th>P&L</th><th>P&L %</th><th>R</th><th>Closed</th><th></th></tr></thead><tbody>
      ${trades.map(t => `<tr>
        <td><span class="ticker-link" onclick="openTickerDetail('${esc(t.ticker)}')">${esc(t.ticker)}</span></td>
        <td>${t.strategy ? `<span class="strat-badge">${esc(t.strategy)}</span>` : '<span class="muted">--</span>'}</td>
        <td class="mono">$${Number(t.avg_cost).toFixed(2)} → $${Number(t.exit_price).toFixed(2)}</td>
        <td class="mono">${t.shares}</td>
        <td class="mono ${t.pnl >= 0 ? 'up' : 'down'}">${fmtMoney(t.pnl)}</td>
        <td>${fmtPct(t.pnl_pct)}</td>
        <td class="mono">${rcell(t.r_multiple)}</td>
        <td class="muted" style="font-size:11px;">${t.exit_date || (t.closed_at || '').slice(0, 10)}</td>
        <td><button class="btn btn-sm" onclick="del(${t.id})">Delete</button></td>
      </tr>`).join('')}
      </tbody></table>`;
  }

  async function del(id) {
    if (!confirm('Delete this journal entry? This only removes the record, it does not reopen the position.')) return;
    try { await api('/api/journal/' + id, { method: 'DELETE' }); load(); }
    catch (e) { alert(e.message); }
  }

  initHeader('/journal').then(load);
  </script>
</body>
</html>
