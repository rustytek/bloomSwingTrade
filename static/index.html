<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>Swing Trader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      overflow: hidden
    }

    body {
      background: #0d0d0d;
      color: #c8c8c8;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 13px;
      min-width: 1280px
    }

    #root {
      height: 100%
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px
    }

    ::-webkit-scrollbar-track {
      background: #111
    }

    ::-webkit-scrollbar-thumb {
      background: #2e2e2e;
      border-radius: 3px
    }

    .mono {
      font-family: 'JetBrains Mono', 'Courier New', monospace
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent
    }

    input[type=range]::-webkit-slider-runnable-track {
      height: 4px;
      background: transparent
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #f0a500;
      cursor: pointer;
      pointer-events: all;
      border: 2px solid #0d0d0d;
      margin-top: -4px
    }

    select {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #c8c8c8;
      padding: 5px 8px;
      border-radius: 3px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      cursor: pointer;
      outline: none;
      width: 100%
    }

    select:focus {
      border-color: #f0a500
    }

    select option {
      background: #1a1a1a
    }

    button {
      cursor: pointer;
      border: none;
      outline: none;
      font-family: 'Inter', sans-serif
    }

    input[type=text],
    input[type=number],
    input[type=password] {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #c8c8c8;
      padding: 5px 8px;
      border-radius: 3px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      outline: none
    }

    input[type=text]:focus,
    input[type=number]:focus {
      border-color: #f0a500
    }

    textarea {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #c8c8c8;
      padding: 6px 8px;
      border-radius: 3px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      outline: none;
      resize: vertical
    }

    textarea:focus {
      border-color: #f0a500
    }

    /* Tooltip */
    .tip {
      position: relative;
      display: inline-flex;
      align-items: center
    }

    .tip:hover .tip-box {
      display: block
    }

    .tip-box {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #1e1e1e;
      border: 1px solid #333;
      color: #c8c8c8;
      font-size: 11px;
      font-weight: 400;
      padding: 6px 9px;
      border-radius: 4px;
      white-space: normal;
      width: 200px;
      z-index: 999;
      pointer-events: none;
      line-height: 1.5;
      box-shadow: 0 4px 12px #000a
    }

    .tip-box::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: #333
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;
    const { createPortal } = ReactDOM;

    /* ── Auth ── */
    const getToken = () => localStorage.getItem('st_token');
    const clearToken = () => localStorage.removeItem('st_token');
    const authHdr = () => ({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() });
    async function apiFetch(url, opts = {}) {
      const r = await fetch(url, { headers: authHdr(), ...opts });
      if (r.status === 401) { clearToken(); location.reload(); }
      return r;
    }

    /* ── Format helpers ── */
    const fmt2 = v => v == null ? '—' : v.toFixed(2);
    const fmt1 = v => v == null ? '—' : v.toFixed(1);
    const fmt0 = v => v == null ? '—' : Math.round(v).toLocaleString();
    const fmtPct = (v, d = 1) => v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(d) + '%';
    const fmtB = v => v == null ? '—' : v >= 1000 ? '$' + (v / 1000).toFixed(1) + 'T' : v >= 1 ? '$' + v.toFixed(1) + 'B' : '$' + (v * 1000).toFixed(0) + 'M';
    const clr = (v) => { if (v == null) return '#888'; return v > 0 ? '#00d26a' : '#ff4d4d'; };
    const heatColor = v => {
      if (v == null) return '#1a1a1a';
      const c = Math.max(-10, Math.min(10, v));
      if (c > 0) { const t = c / 10; return `rgb(${Math.round(26)},${Math.round(26 + t * 184)},${Math.round(26 + t * 80)})`; }
      const t = -c / 10; return `rgb(${Math.round(26 + t * 229)},${Math.round(26 + t * 51)},${Math.round(26 + t * 51)})`;
    };

    /* ── Tooltip component ── */
    function Tip({ label, tip, children }) {
      return <span className="tip">
        {label || children}
        {tip && <span className="tip-box">{tip}</span>}
      </span>;
    }

    /* ── Column definitions ── */
    const COL_TIPS = {
      ticker: 'Stock symbol (e.g. AAPL)',
      name: 'Company name',
      spark: '7-day price trend',
      price: 'Current market price',
      chg_pct: 'Today\'s price change %. Green=up, Red=down',
      mkt_cap: 'Market capitalization in billions. Large>$10B, Mid $2-10B, Small<$2B',
      pe: 'Price/Earnings ratio (trailing). Lower=cheaper relative to earnings. <15 value, 15-25 fair, >25 growth',
      fwd_pe: 'Forward P/E using estimated future earnings. Often lower than trailing P/E for growing companies',
      eps_grw: 'Earnings per share growth YoY%. Higher is better. >20% = strong growth',
      rev_grw: 'Revenue growth YoY%. Sustainable businesses need revenue growth',
      pm: 'Profit margin %. Net income / revenue. Higher=more profitable. >20% = strong',
      debt_eq: 'Debt-to-Equity ratio. Lower=less financial risk. >2 may be concerning',
      rsi: 'Relative Strength Index (14-day). 0-100 scale. >70=overbought, <30=oversold, 50=neutral',
      macd_sig: 'MACD signal line crossover. Bullish=upward momentum, Bearish=downward momentum',
      vs_ma50: '% above/below 50-day moving average. Positive=above (bullish near-term)',
      vs_ma200: '% above/below 200-day moving average. Positive=above (bullish long-term trend)',
      p52w: 'Position within 52-week range (0%=at low, 100%=at high). >75% = near highs',
      vol_r: 'Volume ratio: recent 5-day avg vs 20-day avg. >1.5 = high volume (confirmation)',
      beta: 'Volatility vs S&P 500. 1.0=market, >1=more volatile, <1=less volatile',
      div: 'Annual dividend yield %. Income investors seek >2%',
      ann_ret: 'Annualized return based on the last 1 month (21 trading days) of price data',
      sharpe: 'Sharpe ratio: return per unit of risk. >1=good, >2=excellent',
      score_f: 'Fundamental score 0-5. Rates P/E, margins, growth, debt, FCF',
      score_t: 'Technical score 0-5. Rates RSI, MACD, MA position, volume',
      score_m: 'Momentum score 0-5. Rates 52W position, volume trend, earnings',
      score: 'Overall composite score 0-5. Average of F+T+M scores',
      gc: 'Golden Cross: MA50 crossed above MA200 (bullish long-term signal)',
      dc: 'Death Cross: MA50 crossed below MA200 (bearish long-term signal)',
      vol_1m: '1-month annualized volatility (std dev of daily returns × √252). Lower=less risky. <20%=low, >40%=high',
      max_dd_1m: 'Max drawdown over the last 1 month: largest peak-to-trough decline. Lower is better',
    };

    const ALL_COLS = [
      { k: 'ticker', label: 'Ticker', w: 80 },
      { k: 'name', label: 'Name', w: 155 },
      { k: 'spark', label: 'Trend', w: 20 },
      { k: 'price', label: 'Price', w: 75 },
      { k: 'chg_pct', label: 'Chg%', w: 70 },
      { k: 'mkt_cap', label: 'Mkt Cap', w: 85 },
      { k: 'pe', label: 'P/E', w: 58 },
      { k: 'fwd_pe', label: 'Fwd P/E', w: 68 },
      { k: 'eps_grw', label: 'EPS Grw', w: 72 },
      { k: 'rev_grw', label: 'Rev Grw', w: 72 },
      { k: 'pm', label: 'Margin', w: 68 },
      { k: 'debt_eq', label: 'D/E', w: 55 },
      { k: 'rsi', label: 'RSI', w: 52 },
      { k: 'macd_sig', label: 'MACD', w: 70 },
      { k: 'vs_ma50', label: 'vMA50', w: 68 },
      { k: 'vs_ma200', label: 'vMA200', w: 72 },
      { k: 'p52w', label: '52W%', w: 58 },
      { k: 'vol_r', label: 'VolR', w: 58 },
      { k: 'gain_sharpe', label: 'Gain Sh.', w: 70 },
      { k: 'vol', label: 'Vol', w: 55 },
      { k: 'beta', label: 'Beta', w: 52 },
      { k: 'div', label: 'Div%', w: 55 },
      { k: 'ann_ret', label: 'AnnRet', w: 68 },
      { k: 'sharpe', label: 'Sharpe', w: 62 },
      { k: 'score_f', label: 'F', w: 42 },
      { k: 'score_t', label: 'T', w: 42 },
      { k: 'score_m', label: 'M', w: 42 },
      { k: 'score', label: 'Score', w: 76 },
      { k: 'vol_1m', label: 'Vol 1M', w: 68 },
      { k: 'max_dd_1m', label: 'MaxDD 1M', w: 80 },
    ];
    const DEFAULT_COLS = ['ticker', 'name', 'spark', 'price', 'chg_pct', 'mkt_cap', 'pe', 'rsi', 'macd_sig', 'vs_ma50', 'p52w', 'vol_r', 'gain_sharpe', 'vol', 'score_f', 'score_t', 'score_m', 'score'];

    /* ── Presets ── */
    const PRESETS = [
      { name: 'Breakout', f: { rsi_min: 55, rsi_max: 70, vs_ma50: 'above', vol_r_min: 1.5, p52w_min: 70 } },
      { name: 'Value', f: { pe_max: 15, fwd_pe_max: 12, pm_min: 10, fcf_only: true } },
      { name: 'Growth', f: { eps_grw_min: 20, rev_grw_min: 15, rsi_min: 50 } },
      { name: 'Momentum', f: { p52w_min: 60, vs_ma200: 'above', vs_ma50: 'above', vol_r_min: 1.2 } },
      { name: 'Oversold', f: { rsi_min: 25, rsi_max: 40, vs_ma50: 'below' } },
      { name: 'Dividend', f: { div_min: 2, fcf_only: true, pe_max: 25 } },
      { name: 'Golden Cross', f: { gc: true, vs_ma200: 'above' } },
      { name: 'Large Cap Quality', f: { cap_tier: 'Large', pm_min: 15, fcf_only: true, score_f_min: 3 } },
    ];

    const defFilters = () => ({
      pe_min: '', pe_max: '', fwd_pe_min: '', fwd_pe_max: '',
      eps_grw_min: '', eps_grw_max: '', rev_grw_min: '', rev_grw_max: '',
      pm_min: '', pm_max: '', debt_eq_min: '', debt_eq_max: '', fcf_only: false,
      rsi_min: '', rsi_max: '', macd: '', vs_ma200: '', vs_ma50: '', gc: false, dc: false,
      vol_r_min: '', p52w_min: '', p52w_max: '', earn_beat: false, earn_soon: false,
      gain_sharpe_min: '', vol_max: '',
      beta_min: '', beta_max: '', div_min: '', div_max: '', sectors: [],
      asset_type: '', cap_tier: '',
      score_min: '', score_f_min: '', score_t_min: '', score_m_min: '',
      force_refresh: false,
    });

    /* ── Small components ── */
    function scoreGradient(val, max = 5) {
      const t = Math.max(0, Math.min(1, (val - 1) / (max - 1)));
      const r = Math.round(255 * (1 - t));
      const g = Math.round(77 + 133 * t);
      const b = Math.round(77 * (1 - t) + 106 * t);
      return `rgb(${r},${g},${b})`;
    }
    function ScoreDots({ val, max = 5, color }) {
      const c = color || (val > 0 ? scoreGradient(val, max) : '#f0a500');
      return <span style={{ display: 'inline-flex', gap: 2 }}>
        {Array.from({ length: max }, (_, i) => (
          <span key={i} style={{ width: 7, height: 7, borderRadius: '50%', background: i < val ? c : '#2a2a2a', border: `1px solid ${i < val ? c : '#333'}` }} />
        ))}
      </span>;
    }
    function Toggle({ checked, onChange, label }) {
      return <label style={{ display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer', userSelect: 'none' }}>
        <span style={{ position: 'relative', width: 30, height: 16, display: 'inline-block' }}>
          <input type="checkbox" checked={checked} onChange={e => onChange(e.target.checked)}
            style={{ opacity: 0, width: 0, height: 0, position: 'absolute' }} />
          <span style={{ position: 'absolute', inset: 0, borderRadius: 8, background: checked ? '#f0a500' : '#2a2a2a', transition: 'background .2s' }} />
          <span style={{ position: 'absolute', top: 2, left: checked ? 14 : 2, width: 12, height: 12, borderRadius: '50%', background: '#fff', transition: 'left .2s' }} />
        </span>
        {label && <span style={{ color: '#aaa', fontSize: 11 }}>{label}</span>}
      </label>;
    }
    function RangeRow({ label, minKey, maxKey, filters, setFilters, step, tip }) {
      return <div style={{ marginBottom: 6 }}>
        <div style={{ fontSize: 10, color: '#666', marginBottom: 3 }}>
          {tip ? <Tip label={label} tip={tip} /> : label}
        </div>
        <div style={{ display: 'flex', gap: 4 }}>
          <input type="number" placeholder="min" step={step || 'any'} value={filters[minKey]}
            onChange={e => setFilters(p => ({ ...p, [minKey]: e.target.value }))} style={{ width: '100%' }} />
          <input type="number" placeholder="max" step={step || 'any'} value={filters[maxKey]}
            onChange={e => setFilters(p => ({ ...p, [maxKey]: e.target.value }))} style={{ width: '100%' }} />
        </div>
      </div>;
    }
    function FilterSection({ title, children, defaultOpen = false, badge = 0 }) {
      const [open, setOpen] = useState(defaultOpen);
      return <div style={{ borderBottom: '1px solid #1a1a1a', marginBottom: 2 }}>
        <div onClick={() => setOpen(o => !o)} style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '7px 0', cursor: 'pointer', userSelect: 'none'
        }}>
          <span style={{ fontSize: 11, fontWeight: 600, color: '#aaa', letterSpacing: .5, textTransform: 'uppercase' }}>{title}</span>
          <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
            {badge > 0 && <span style={{
              background: '#f0a500', color: '#000', fontSize: 9, fontWeight: 700,
              padding: '1px 5px', borderRadius: 8, lineHeight: '14px'
            }}>{badge}</span>}
            <span style={{ color: '#555', fontSize: 10 }}>{open ? '▲' : '▼'}</span>
          </div>
        </div>
        {open && <div style={{ paddingBottom: 8 }}>{children}</div>}
      </div>;
    }

    /* ── Sparkline ── */
    function Sparkline({ data, width = 80, height = 26 }) {
      if (!data || data.length < 2) return <span style={{ color: '#333', fontSize: 10 }}>—</span>;
      const mn = Math.min(...data), mx = Math.max(...data), rng = mx - mn || 1;
      const pts = data.map((v, i) => `${(i / (data.length - 1)) * width},${height - ((v - mn) / rng) * (height - 3) - 1.5}`).join(' ');
      const last = data[data.length - 1], first = data[0];
      const c = last >= first ? '#00d26a' : '#ff4d4d';
      return <svg width={width} height={height} style={{ display: 'block', verticalAlign: 'middle' }}>
        <polyline points={pts} fill="none" stroke={c} strokeWidth="1.5" strokeLinejoin="round" />
        <circle cx={(data.length - 1) / (data.length - 1) * width} cy={height - ((last - mn) / rng) * (height - 3) - 1.5} r="2" fill={c} />
      </svg>;
    }

    /* ── Technical chart ── */
    function TechnicalChart({ history, indicators, heatMode, spyHistory, spyIndicators }) {
      const [period, setPeriod] = useState(180);
      const [showMA50, setShowMA50] = useState(true);
      const [showMA200, setShowMA200] = useState(false);
      const [showBB, setShowBB] = useState(false);
      const [show52W, setShow52W] = useState(false);
      const [showSPY, setShowSPY] = useState(false);

      if (!history || !history.length) return <div style={{ padding: 20, color: '#555', textAlign: 'center' }}>No chart data</div>;

      const barsToUse = history.slice(-period);
      const startIdx = history.length - barsToUse.length;

      const W = Math.min(window.innerWidth * 0.85, 1200), H = Math.max(window.innerHeight * 0.55, 260), PAD = { t: 10, r: 10, b: 28, l: 52 };
      const bars = barsToUse;
      const ma50 = showMA50 ? (indicators?.ma50?.slice(startIdx) || []) : [];
      const ma200 = showMA200 ? (indicators?.ma200?.slice(startIdx) || []) : [];
      const bb = showBB ? (indicators?.bb?.slice(startIdx) || []) : [];
      const mn = Math.min(...bars.map(b => b.low)) * 0.998;
      const mx = Math.max(...bars.map(b => b.high)) * 1.002;
      const cW = W - PAD.l - PAD.r, cH = H - PAD.t - PAD.b;
      const n = bars.length, bw = Math.max(2, Math.floor(cW / (n || 1)) - 1);
      const xOf = i => PAD.l + (i / (n - 1 || 1)) * cW;
      const yOf = v => PAD.t + cH - (((v - mn) / (mx - mn || 1)) * cH);
      const yTicks = Array.from({ length: 5 }, (_, i) => mn + (mx - mn) * i / 4);
      const maxVol = Math.max(...bars.map(b => b.vol)), volH = 40;

      // 52W lines from full history
      const high52 = show52W ? Math.max(...history.map(b => b.high)) : null;
      const low52 = show52W ? Math.min(...history.map(b => b.low)) : null;

      // SPY normalized overlay
      const spyPath = (() => {
        if (!showSPY || !spyHistory || !spyHistory.length) return null;
        const slice = spyHistory.slice(-period);
        if (slice.length < 2) return null;
        const sc = slice.map(d => d.close);
        const sm = Math.min(...sc), sx = Math.max(...sc), sr = (sx - sm) || 1;
        return sc.map((v, i) => {
          const px = xOf(i).toFixed(1);
          const py = yOf(mn + ((v - sm) / sr) * (mx - mn)).toFixed(1);
          return `${i === 0 ? 'M' : 'L'}${px},${py}`;
        }).join(' ');
      })();

      // Toggle button config
      const TOGGLES = [
        { key: 'MA50', on: showMA50, set: setShowMA50, col: '#3b9eff' },
        { key: 'MA200', on: showMA200, set: setShowMA200, col: '#ff6b35' },
        { key: 'BB', on: showBB, set: setShowBB, col: '#f0a500' },
        { key: '52W', on: show52W, set: setShow52W, col: '#888888' },
        { key: 'SPY', on: showSPY, set: setShowSPY, col: '#ffffff' },
      ];

      return <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 12, paddingLeft: PAD.l, flexWrap: 'wrap' }}>
          <div style={{ display: 'flex', gap: 4 }}>
            {[7, 14, 21, 30, 180].map(d => (
              <button key={d} onClick={() => setPeriod(d)} style={{
                background: period === d ? '#f0a500' : '#1a1a1a',
                color: period === d ? '#000' : '#aaa',
                padding: '4px 10px', borderRadius: 3, fontSize: 11, border: '1px solid #2a2a2a'
              }}>
                {d === 180 ? 'All' : d + 'D'}
              </button>
            ))}
          </div>
          <div style={{ width: 1, height: 14, background: '#2a2a2a' }} />
          {TOGGLES.map(({ key, on, set, col }) => (
            <button key={key} onClick={() => set(p => !p)} style={{
              padding: '4px 10px', borderRadius: 3, fontSize: 11,
              background: on ? col + '22' : 'transparent',
              border: `1px solid ${on ? col : '#2a2a2a'}`,
              color: on ? col : '#555'
            }}>{key}</button>
          ))}
        </div>
        <svg width={W} height={H + volH} style={{ display: 'block', maxWidth: '100%' }}>
          {yTicks.map((v, i) => <g key={i}>
            <line x1={PAD.l} y1={yOf(v)} x2={W - PAD.r} y2={yOf(v)} stroke="#1e1e1e" strokeWidth="1" />
            <text x={PAD.l - 4} y={yOf(v) + 4} textAnchor="end" fontSize="9" fill="#555">${v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v.toFixed(0)}</text>
          </g>)}
          {/* BB bands */}
          {bb.length > 1 && <>
            <polyline points={bb.map((v, i) => v != null ? `${xOf(i)},${yOf(v.upper)}` : '').filter(Boolean).join(' ')}
              fill="none" stroke="#f0a50088" strokeWidth="1" strokeDasharray="3,2" />
            <polyline points={bb.map((v, i) => v != null ? `${xOf(i)},${yOf(v.lower)}` : '').filter(Boolean).join(' ')}
              fill="none" stroke="#f0a50088" strokeWidth="1" strokeDasharray="3,2" />
          </>}
          {/* 52W hi/lo lines */}
          {show52W && high52 != null && high52 >= mn && high52 <= mx &&
            <line x1={PAD.l} y1={yOf(high52)} x2={W - PAD.r} y2={yOf(high52)} stroke="#888" strokeWidth="0.8" strokeDasharray="4,3" />}
          {show52W && low52 != null && low52 <= mx && low52 >= mn &&
            <line x1={PAD.l} y1={yOf(low52)} x2={W - PAD.r} y2={yOf(low52)} stroke="#555" strokeWidth="0.8" strokeDasharray="4,3" />}
          {/* MA200 */}
          {ma200.length > 1 && <polyline points={ma200.map((v, i) => v != null ? `${xOf(i)},${yOf(v)}` : '').filter(Boolean).join(' ')}
            fill="none" stroke="#ff6b35" strokeWidth="1.2" opacity=".8" />}
          {/* MA50 */}
          {ma50.length > 1 && <polyline points={ma50.map((v, i) => v != null ? `${xOf(i)},${yOf(v)}` : '').filter(Boolean).join(' ')}
            fill="none" stroke="#3b9eff" strokeWidth="1.2" opacity=".8" />}
          {/* SPY normalized */}
          {spyPath && <path d={spyPath} fill="none" stroke="#ffffff" strokeWidth="1.2" opacity=".35" />}
          {/* Candles */}
          {bars.map((b, i) => {
            const x = xOf(i), isUp = b.close >= b.open;
            const c = heatMode ? heatColor(b.close / b.open * 100 - 100) : (isUp ? '#00d26a' : '#ff4d4d');
            return <g key={i}>
              <line x1={x} y1={yOf(b.high)} x2={x} y2={yOf(b.low)} stroke={c} strokeWidth="1" />
              <rect x={x - bw / 2} y={yOf(Math.max(b.open, b.close))} width={bw}
                height={Math.max(1, Math.abs(yOf(b.open) - yOf(b.close)))} fill={c} opacity=".9" />
            </g>;
          })}
          {[0, Math.floor(n / 4), Math.floor(n / 2), Math.floor(3 * n / 4), n - 1].map(i =>
            bars[i] ? <text key={i} x={xOf(i)} y={H - 2} textAnchor="middle" fontSize="9" fill="#555">
              {bars[i].date.slice(5)}
            </text> : null
          )}
          {bars.map((b, i) => {
            const x = xOf(i), vh = maxVol > 0 ? (b.vol / maxVol) * volH : 0;
            return <rect key={i} x={x - bw / 2} y={H + volH - vh} width={bw} height={vh}
              fill={b.close >= b.open ? '#00d26a44' : '#ff4d4d44'} />;
          })}
          {showMA50 && <text x={PAD.l + 4} y={PAD.t + 12} fontSize="9" fill="#3b9eff">MA50</text>}
          {showMA200 && <text x={PAD.l + (showMA50 ? 40 : 4)} y={PAD.t + 12} fontSize="9" fill="#ff6b35">MA200</text>}
        </svg></div>;
    }

    /* ── Fundamentals chart (mock quarterly) ── */
    function FundamentalsChart({ ticker }) {
      const quarters = useMemo(() => {
        let seed = 0; for (const c of (ticker || '')) seed = (seed * 31 + c.charCodeAt(0)) & 0xffff;
        const rng = () => { seed = (seed * 1664525 + 1013904223) & 0xffffffff; return (seed >>> 16) / 65535; };
        const baseEps = 1 + rng() * 3, baseRev = 500 + rng() * 2000, baseMargin = 5 + rng() * 25, basePe = 10 + rng() * 25;
        return Array.from({ length: 8 }, (_, i) => ({
          label: `${['Q1', 'Q2', 'Q3', 'Q4'][i % 4]}'${String(2023 + Math.floor(i / 4)).slice(2)}`,
          eps: +(baseEps * (0.8 + rng() * 0.6) * (1 + i * 0.03)).toFixed(2),
          rev: +(baseRev * (0.85 + rng() * 0.4) * (1 + i * 0.02)).toFixed(0),
          margin: +(baseMargin * (0.85 + rng() * 0.4)).toFixed(1),
          pe: +(basePe * (0.85 + rng() * 0.4)).toFixed(1),
          beat: rng() > 0.45,
        }));
      }, [ticker]);

      const W = 340, H = 110, PAD = { t: 18, r: 8, b: 22, l: 36 };
      const n = quarters.length;
      const bw = Math.floor((W - PAD.l - PAD.r) / n) - 2;
      const xOf = i => PAD.l + (i + 0.5) * ((W - PAD.l - PAD.r) / n);
      const cH = H - PAD.t - PAD.b;

      function BarChart({ title, vals, color, beat }) {
        const maxV = Math.max(...vals, 0.01);
        return <svg width={W} height={H} style={{ display: 'block', width: '100%' }}>
          <text x={W / 2} y={12} textAnchor="middle" fontSize="9" fill="#666" letterSpacing="0.05em">{title}</text>
          {[0, 0.5, 1].map((f, i) => <g key={i}>
            <line x1={PAD.l} y1={PAD.t + cH - f * cH} x2={W - PAD.r} y2={PAD.t + cH - f * cH} stroke="#1a1a1a" strokeWidth="0.5" />
            <text x={PAD.l - 3} y={PAD.t + cH - f * cH + 3} textAnchor="end" fontSize="7" fill="#444">{(f * maxV).toFixed(1)}</text>
          </g>)}
          {vals.map((v, i) => {
            const bh = (v / maxV) * cH, by = PAD.t + cH - bh;
            return <g key={i}>
              <rect x={xOf(i) - bw / 2} y={by} width={bw} height={bh} fill={color} opacity="0.75" />
              {beat && beat[i] !== undefined && <circle cx={xOf(i)} cy={by - 4} r={3} fill={beat[i] ? '#00d26a' : '#ff4d4d'} />}
              <text x={xOf(i)} y={H - 5} textAnchor="middle" fontSize="7" fill="#444">{quarters[i].label}</text>
            </g>;
          })}
        </svg>;
      }

      function LineChart({ title, vals, color, fmt }) {
        const mn = Math.min(...vals), mx = Math.max(...vals), rng = (mx - mn) || 1;
        const yS = v => PAD.t + cH - ((v - mn) / rng) * cH;
        const xS = i => PAD.l + i / (vals.length - 1) * (W - PAD.l - PAD.r);
        const path = vals.map((v, i) => `${i === 0 ? 'M' : 'L'}${xS(i).toFixed(1)},${yS(v).toFixed(1)}`).join(' ');
        const area = path + ` L${xS(vals.length - 1).toFixed(1)},${PAD.t + cH} L${PAD.l},${PAD.t + cH}Z`;
        return <svg width={W} height={H} style={{ display: 'block', width: '100%' }}>
          <text x={W / 2} y={12} textAnchor="middle" fontSize="9" fill="#666" letterSpacing="0.05em">{title}</text>
          {[0, 0.5, 1].map((f, i) => <g key={i}>
            <line x1={PAD.l} y1={yS(mn + f * rng)} x2={W - PAD.r} y2={yS(mn + f * rng)} stroke="#1a1a1a" strokeWidth="0.5" />
            <text x={PAD.l - 3} y={yS(mn + f * rng) + 3} textAnchor="end" fontSize="7" fill="#444">{fmt ? fmt(mn + f * rng) : (mn + f * rng).toFixed(1)}</text>
          </g>)}
          <path d={area} fill={color + '18'} />
          <path d={path} fill="none" stroke={color} strokeWidth="1.4" />
          {vals.map((v, i) => <g key={i}>
            <circle cx={xS(i)} cy={yS(v)} r={2.5} fill={color} />
            <text x={xS(i)} y={H - 5} textAnchor="middle" fontSize="7" fill="#444">{quarters[i].label}</text>
          </g>)}
        </svg>;
      }

      return <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px 16px' }}>
        <BarChart title="QUARTERLY EPS ($)" vals={quarters.map(q => q.eps)} color="#5ba3ff" beat={quarters.map(q => q.beat)} />
        <LineChart title="PROFIT MARGIN (%)" vals={quarters.map(q => q.margin)} color="#00d26a" fmt={v => v.toFixed(1) + '%'} />
        <BarChart title="REVENUE ($B)" vals={quarters.map(q => q.rev)} color="#f0a500" />
        <LineChart title="P/E RATIO" vals={quarters.map(q => q.pe)} color="#c084fc" fmt={v => v.toFixed(1) + 'x'} />
      </div>;
    }

    /* ── RSI mini-chart ── */
    function RsiChart({ rsiSeries, width = 360, height = 60 }) {
      if (!rsiSeries || rsiSeries.length < 2) return null;
      const data = rsiSeries.filter(v => v != null);
      if (data.length < 2) return null;
      const W = width, H = height, PAD = { t: 4, r: 4, b: 16, l: 28 };
      const cW = W - PAD.l - PAD.r, cH = H - PAD.t - PAD.b;
      const xOf = i => PAD.l + (i / (data.length - 1)) * cW;
      const yOf = v => PAD.t + cH - (v / 100) * cH;
      return <svg width={W} height={H} style={{ display: 'block' }}>
        {[30, 50, 70].map(v => <g key={v}>
          <line x1={PAD.l} y1={yOf(v)} x2={W - PAD.r} y2={yOf(v)}
            stroke={v === 50 ? '#2a2a2a' : '#1e1e1e'} strokeDasharray={v !== 50 ? '3,2' : ''} strokeWidth="1" />
          <text x={PAD.l - 2} y={yOf(v) + 3} textAnchor="end" fontSize="8" fill="#555">{v}</text>
        </g>)}
        <polyline points={data.map((v, i) => `${xOf(i)},${yOf(v)}`).join(' ')} fill="none" stroke="#f0a500" strokeWidth="1.5" />
        <text x={4} y={PAD.t + 10} fontSize="9" fill="#f0a500">RSI</text>
      </svg>;
    }

    /* ── MACD mini-chart ── */
    function MacdChart({ macdData, width = 360, height = 60 }) {
      if (!macdData || !macdData.macd_line) return null;
      const macd = macdData.macd_line.filter(v => v != null);
      const sig = (macdData.signal || []).filter(v => v != null);
      const hist = (macdData.histogram || []).filter(v => v != null);
      if (macd.length < 2) return null;
      const W = width, H = height, PAD = { t: 4, r: 4, b: 16, l: 28 };
      const cW = W - PAD.l - PAD.r, cH = H - PAD.t - PAD.b;
      const allV = [...macd, ...sig, ...hist];
      const mn = Math.min(...allV), mx = Math.max(...allV), rng = mx - mn || 1;
      const xOf = i => PAD.l + (i / (macd.length - 1)) * cW;
      const yOf = v => PAD.t + cH - (((v - mn) / rng) * cH);
      const zero = yOf(0);
      return <svg width={W} height={H} style={{ display: 'block' }}>
        <line x1={PAD.l} y1={zero} x2={W - PAD.r} y2={zero} stroke="#2a2a2a" strokeWidth="1" />
        {hist.map((v, i) => {
          const y = yOf(v); return <rect key={i} x={xOf(i) - 1} y={Math.min(y, zero)} width={2}
            height={Math.abs(y - zero)} fill={v >= 0 ? '#00d26a66' : '#ff4d4d66'} />;
        })}
        <polyline points={macd.map((v, i) => `${xOf(i)},${yOf(v)}`).join(' ')} fill="none" stroke="#3b9eff" strokeWidth="1.5" />
        <polyline points={sig.map((v, i) => `${xOf(i)},${yOf(v)}`).join(' ')} fill="none" stroke="#f0a500" strokeWidth="1.2" />
        <text x={4} y={PAD.t + 10} fontSize="9" fill="#3b9eff">MACD</text>
      </svg>;
    }

      const handleCSVImport = async () => {

    /* ── Watchlist Panel (sidebar tray) ── */

    }

    /* ── Compare Panel ── */
    const CMP_COLORS = ['#f0a500', '#3b9eff', '#00d26a', '#ff4d4d', '#a855f7', '#06b6d4', '#f97316', '#ec4899', '#84cc16', '#f43f5e', '#8b5cf6', '#14b8a6', '#fb923c', '#c084fc', '#34d399', '#fbbf24', '#60a5fa', '#4ade80'];
    function ComparePanel({ watchlist, onClose }) {
      const [tab, setTab] = useState('performance'); // 'performance', 'returns', 'correlation'
      const [perfSource, setPerfSource] = useState('watchlist');
      const [returnsSource, setReturnsSource] = useState('watchlist');
      const [corrSource, setCorrSource] = useState('watchlist');
      const [period, setPeriod] = useState(30);
      const [showSpy, setShowSpy] = useState(true);
      const [portfolioTickers, setPortfolioTickers] = useState([]);
      const [histories, setHistories] = useState({});
      const [spyHistory, setSpyHistory] = useState([]);
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        apiFetch('/api/portfolio').then(async r => {
          if (r.ok) { const d = await r.json(); setPortfolioTickers((d.positions || []).map(p => p.ticker)); }
        });
        // Always pre-fetch SPY for benchmark
        apiFetch('/api/stocks/SPY/history').then(async r => {
          if (r.ok) { const d = await r.json(); setSpyHistory(d.bars || []); }
        });
      }, []);

      const getTickersForSource = (source) => {
        const wl = [...watchlist], pt = [...portfolioTickers];
        if (source === 'watchlist') return wl;
        if (source === 'portfolio') return pt;
        return [...new Set([...wl, ...pt])];
      };

      const perfTickers = useMemo(() => getTickersForSource(perfSource), [perfSource, watchlist, portfolioTickers]);
      const returnsTickers = useMemo(() => getTickersForSource(returnsSource), [returnsSource, watchlist, portfolioTickers]);
      const corrTickers = useMemo(() => getTickersForSource(corrSource), [corrSource, watchlist, portfolioTickers]);

      const allUniqueTickers = useMemo(() => {
        return [...new Set([...perfTickers, ...returnsTickers, ...corrTickers])];
      }, [perfTickers, returnsTickers, corrTickers]);

      const tickerKey = allUniqueTickers.join(',');
      useEffect(() => {
        if (!tickerKey) { setLoading(false); setHistories({}); return; }
        setLoading(true);
        const result = {};
        Promise.all(allUniqueTickers.map(async ticker => {
          try {
            const r = await apiFetch(`/api/stocks/${ticker}/history`);
            if (r.ok) { const d = await r.json(); result[ticker] = d.bars || []; }
          } catch (e) { }
        })).then(() => { setHistories(result); setLoading(false); });
      }, [tickerKey]);

      const normalize = (bars) => {
        const sliced = period === 182 ? bars : bars.slice(-period);
        if (sliced.length < 2) return null;
        const base = sliced[0].close;
        return {
          pct: sliced.map(b => ((b.close - base) / base) * 100),
          startDate: sliced[0].date, endDate: sliced[sliced.length - 1].date
        };
      };

      const chartData = useMemo(() => {
        return perfTickers.map((ticker, i) => {
          const n = normalize(histories[ticker] || []);
          if (!n) return null;
          return {
            ticker, color: CMP_COLORS[i % CMP_COLORS.length],
            pct: n.pct, current: n.pct[n.pct.length - 1],
            startDate: n.startDate, endDate: n.endDate, isBenchmark: false
          };
        }).filter(Boolean).sort((a, b) => b.current - a.current);
      }, [histories, perfTickers, period]);

      const spyData = useMemo(() => {
        const n = normalize(spyHistory);
        if (!n) return null;
        return {
          ticker: 'SPY', color: '#888', pct: n.pct, current: n.pct[n.pct.length - 1],
          startDate: n.startDate, endDate: n.endDate, isBenchmark: true
        };
      }, [spyHistory, period]);

      const allLines = [...chartData, ...(showSpy && spyData ? [spyData] : [])];

      const W = Math.min(window.innerWidth * 0.9, 1300), H = Math.max(window.innerHeight * 0.7, 340), PAD = { t: 24, r: 24, b: 28, l: 54 };
      const cW = W - PAD.l - PAD.r, cH = H - PAD.t - PAD.b;
      const allPcts = allLines.flatMap(d => d.pct);
      const yMin = allPcts.length ? Math.floor(Math.min(...allPcts, 0) - 2) : -12;
      const yMax = allPcts.length ? Math.ceil(Math.max(...allPcts, 0) + 2) : 12;
      const xOf = (i, len) => PAD.l + (i / Math.max(len - 1, 1)) * cW;
      const yOf = v => PAD.t + cH - ((v - yMin) / (yMax - yMin || 1)) * cH;
      const tickStep = Math.max(1, Math.ceil((yMax - yMin) / 8));
      const yTicks = [];
      for (let v = Math.ceil(yMin / tickStep) * tickStep; v <= yMax; v += tickStep)yTicks.push(v);

      // Annualized Returns Calculation
      const calculateAnnualizedReturns = (tickerList) => {
        const results = tickerList.map(ticker => {
          const bars = histories[ticker] || [];
          const sliced = period === 182 ? bars : bars.slice(-period);
          if (sliced.length < 2) return null;

          const startPrice = sliced[0].close;
          const endPrice = sliced[sliced.length - 1].close;
          const numDays = sliced.length;

          if (numDays === 0 || startPrice === 0) return null;

          const totalReturn = (endPrice - startPrice) / startPrice;
          const annualizedReturn = Math.pow(1 + totalReturn, 365 / numDays) - 1;
          return { ticker, annualizedReturn: annualizedReturn * 100 };
        }).filter(Boolean).sort((a, b) => b.annualizedReturn - a.annualizedReturn);
        return results;
      };

      const annualizedReturnsData = useMemo(() => calculateAnnualizedReturns(returnsTickers), [histories, returnsTickers, period]);

      // Correlation Matrix Calculation
      const calculateCorrelationMatrix = (tickerList) => {
        if (tickerList.length < 2) return { matrix: [], tickers: [] };

        const validTickers = tickerList.filter(ticker => {
          const bars = histories[ticker] || [];
          const sliced = period === 182 ? bars : bars.slice(-period);
          return sliced.length >= 2;
        });

        if (validTickers.length < 2) return { matrix: [], tickers: [] };

        const dailyReturns = {};
        validTickers.forEach(ticker => {
          const bars = histories[ticker] || [];
          const sliced = period === 182 ? bars : bars.slice(-period);
          dailyReturns[ticker] = sliced.slice(1).map((bar, i) => (bar.close - sliced[i].close) / sliced[i].close);
        });

        const commonLength = Math.min(...Object.values(dailyReturns).map(arr => arr.length));
        for (const ticker in dailyReturns) {
          dailyReturns[ticker] = dailyReturns[ticker].slice(0, commonLength);
        }

        const matrix = Array(validTickers.length).fill(0).map(() => Array(validTickers.length).fill(0));

        for (let i = 0; i < validTickers.length; i++) {
          for (let j = i; j < validTickers.length; j++) {
            const returns1 = dailyReturns[validTickers[i]];
            const returns2 = dailyReturns[validTickers[j]];

            if (returns1.length === 0 || returns2.length === 0) {
              matrix[i][j] = matrix[j][i] = NaN;
              continue;
            }

            const mean1 = returns1.reduce((sum, val) => sum + val, 0) / returns1.length;
            const mean2 = returns2.reduce((sum, val) => sum + val, 0) / returns2.length;

            let numerator = 0;
            let denominator1 = 0;
            let denominator2 = 0;

            for (let k = 0; k < returns1.length; k++) {
              numerator += (returns1[k] - mean1) * (returns2[k] - mean2);
              denominator1 += Math.pow(returns1[k] - mean1, 2);
              denominator2 += Math.pow(returns2[k] - mean2, 2);
            }

            const correlation = numerator / (Math.sqrt(denominator1) * Math.sqrt(denominator2));
            matrix[i][j] = matrix[j][i] = isNaN(correlation) ? 0 : correlation; // Handle NaN for zero variance
          }
        }
        return { matrix, tickers: validTickers };
      };

      const correlationData = useMemo(() => calculateCorrelationMatrix(corrTickers), [histories, corrTickers, period]);

      const getCorrelationColor = (value) => {
        if (value > 0.7) return '#00d26a'; // Strong positive
        if (value > 0.3) return '#84cc16'; // Moderate positive
        if (value > -0.3) return '#555'; // Weak/Neutral
        if (value > -0.7) return '#fb923c'; // Moderate negative
        return '#ff4d4d'; // Strong negative
      };

      // ── Annualized return color scale ──
      const annRetColor = (v) => {
        if (v == null) return '#1a1a1a';
        const c = Math.max(-60, Math.min(100, v));
        if (c >= 0) { const t = c / 100; return `rgb(${Math.round(26*(1-t))},${Math.round(26+t*184)},${Math.round(26+t*54)})`; }
        const t = -c / 60; return `rgb(${Math.round(26+t*204)},${Math.round(26*(1-t))},${Math.round(26*(1-t))})`;
      };

      // ── Annualized return periods ──
      const ANN_PERIODS = [
        { label: '7D', bars: 7 },
        { label: '91D', bars: 91 },
        { label: '1mo', bars: 21 },
        { label: '1y', bars: 252 },
      ];
      const calcAnnRet = (bars, n) => {
        const slice = bars.slice(-n);
        if (slice.length < 2) return null;
        const ratio = slice[slice.length - 1].close / slice[0].close;
        if (ratio <= 0) return null;
        return (Math.pow(ratio, 252 / slice.length) - 1) * 100;
      };
      const annData = useMemo(() =>
        returnsTickers.map(ticker => ({
          ticker,
          values: ANN_PERIODS.map(p => calcAnnRet(histories[ticker] || [], p.bars))
        })).filter(d => d.values.some(v => v != null))
      , [histories, returnsTickers]);

      // Sort state for annualized return: { col: 'ticker'|0|1|2|3, dir: 'asc'|'desc' }
      const [annSort, setAnnSort] = useState({ col: null, dir: 'desc' });
      const sortedAnnData = useMemo(() => {
        if (!annData.length) return annData;
        const { col, dir } = annSort;
        if (col === null) return annData;
        const mult = dir === 'desc' ? -1 : 1;
        return [...annData].sort((a, b) => {
          if (col === 'ticker') return mult * a.ticker.localeCompare(b.ticker);
          const va = a.values[col] ?? -Infinity;
          const vb = b.values[col] ?? -Infinity;
          return mult * (va - vb);
        });
      }, [annData, annSort]);
      const handleAnnSort = (col) => {
        setAnnSort(prev => ({
          col,
          dir: prev.col === col && prev.dir === 'desc' ? 'asc' : 'desc'
        }));
      };

      // ── Source selector pill ──
      const SourceSel = ({ value, onChange }) => (
        <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
          <span style={{ fontSize: 10, color: '#555', letterSpacing: .4, textTransform: 'uppercase', marginRight: 2 }}>Source</span>
          {[['watchlist', '★ Watchlist'], ['portfolio', 'Portfolio'], ['both', 'Both']].map(([v, lbl]) => (
            <button key={v} onClick={() => onChange(v)}
              style={{
                padding: '4px 10px', borderRadius: 3, fontSize: 11, border: '1px solid #2a2a2a',
                background: value === v ? '#f0a500' : '#1a1a1a', color: value === v ? '#000' : '#888'
              }}>{lbl}</button>
          ))}
        </div>
      );

      return createPortal(
        <div onClick={e => { if (e.target === e.currentTarget) onClose(); }}
          style={{ position: 'fixed', inset: 0, background: '#000c', zIndex: 200, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{

                {!loading && allLines.length > 0 && <>
                  <svg width={W} height={H} style={{ display: 'block', maxWidth: '100%', overflow: 'visible' }}>
                    {yTicks.map(v => <g key={v}>
                      <line x1={PAD.l} y1={yOf(v)} x2={W - PAD.r} y2={yOf(v)}

                    {chartData.map((d, i) => (

            {/* ══ ANNUALIZED RETURN TAB ══ */}
            {tab === 'annualized' && <>
              <div style={{ padding: '10px 16px', borderBottom: '1px solid #1a1a1a', display: 'flex', alignItems: 'center', gap: 20, flexShrink: 0 }}>

              </div>
              <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
                {loading && <div style={{ textAlign: 'center', color: '#f0a500', padding: 60, fontSize: 12 }}>Fetching price histories…</div>}
                {!loading && returnsTickers.length === 0 && <div style={{ textAlign: 'center', color: '#444', padding: 60, fontSize: 12 }}>
                  No tickers in {returnsSource === 'both' ? 'your watchlist or portfolio' : returnsSource}.
                </div>}

                    <div>
                      <table style={{ borderCollapse: 'collapse', fontSize: 12, minWidth: 500 }}>
                        <thead>

                              TICKER {annSort.col === 'ticker' ? (annSort.dir === 'desc' ? ' ▼' : ' ▲') : ' ⇅'}
                            </th>
                            {ANN_PERIODS.map((p, pi) => (
                              <th key={p.label} onClick={() => handleAnnSort(pi)}
                                style={{ padding: '6px 4px 8px', color: annSort.col === pi ? '#f0a500' : '#666', fontWeight: 600, fontSize: 10, borderBottom: '1px solid #1a1a1a', textAlign: 'center', minWidth: 100, cursor: 'pointer', userSelect: 'none', whiteSpace: 'nowrap' }}>
                                {p.label} {annSort.col === pi ? (annSort.dir === 'desc' ? '▼' : '▲') : '⇅'}
                              </th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {sortedAnnData.map(({ ticker, values }) => (
                            <tr key={ticker}>
                              <td style={{ padding: '3px 16px 3px 0', fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, color: '#f0a500', fontSize: 12 }}>{ticker}</td>
                              {values.map((v, i) => (
                                <td key={i} style={{ padding: '3px 4px', textAlign: 'center' }}>
                                  <div style={{
                                    background: annRetColor(v), borderRadius: 3, padding: '5px 10px',
                                    fontFamily: "'JetBrains Mono',monospace", fontSize: 11, fontWeight: 600,
                                    color: v == null ? '#444' : Math.abs(v) < 5 ? '#ddd' : '#fff'
                                  }}>
                                    {v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(1) + '%'}
                                  </div>
                                </td>
                              ))}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    {/* Vertical legend — stretches to match table height via parent align-items:stretch */}
                    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, paddingTop: 28, paddingBottom: 2, flexShrink: 0 }}>
                      <span style={{ fontSize: 9, color: '#555' }}>+100%</span>
                      <div style={{
                        width: 10, flex: 1, borderRadius: 4,
                        background: 'linear-gradient(180deg,#1aaa50 0%,#1a1a1a 50%,#c41a1a 100%)'
                      }} />
                      <span style={{ fontSize: 9, color: '#555' }}>–60%</span>
                    </div>
                  </div>;
                })()}
              </div>
            </>}

            {/* ══ CORRELATION MATRIX TAB ══ */}
            {tab === 'correlation' && <>
              <div style={{ padding: '10px 16px', borderBottom: '1px solid #1a1a1a', display: 'flex', alignItems: 'center', gap: 20, flexShrink: 0 }}>
                <SourceSel value={corrSource} onChange={setCorrSource} />
                <span style={{ marginLeft: 'auto', fontSize: 11, color: '#444' }}>{corrTickers.length} ticker{corrTickers.length !== 1 ? 's' : ''}</span>
              </div>
              <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
                {loading && <div style={{ textAlign: 'center', color: '#f0a500', padding: 60, fontSize: 12 }}>Fetching price histories…</div>}
                {!loading && corrTickers.length === 0 && <div style={{ textAlign: 'center', color: '#444', padding: 60, fontSize: 12 }}>
                  No tickers in {corrSource === 'both' ? 'your watchlist or portfolio' : corrSource}.
                </div>}
                {!loading && corrTickers.length === 1 && <div style={{ textAlign: 'center', color: '#555', padding: 40, fontSize: 12 }}>
                  Add at least 2 tickers to compute a correlation matrix.
                </div>}
                {!loading && correlationData && correlationData.tickers && correlationData.tickers.length >= 2 && (() => {
                  const { tickers: ct, matrix } = correlationData;
                  const cellSz = Math.max(40, Math.min(70, Math.floor(660 / ct.length)));
                  const lblW = 64;
                  const matrixH = ct.length * (cellSz + 1);
                  const corrCellColor = (v) => {
                    if (isNaN(v)) return '#1a1a1a';
                    if (v > 0.7) return '#176b3a';
                    if (v > 0.4) return '#1e8c4e';
                    if (v > 0.1) return '#2aaa62';
                    if (v > -0.1) return '#2a2a2a';
                    if (v > -0.4) return '#8c3a1e';
                    if (v > -0.7) return '#a6381a';
                    return '#c41a1a';
                  };
                  return <div style={{ display: 'flex', alignItems: 'flex-start', gap: 16, overflowX: 'auto' }}>
                    <div style={{ display: 'inline-block' }}>
                      <div style={{ fontSize: 11, color: '#555', marginBottom: 14 }}>
                        Pearson correlation of daily returns. 1.00 = perfect positive, –1.00 = perfect inverse, 0 = no relationship.
                      </div>
                      <div style={{ display: 'flex', marginLeft: lblW }}>
                        {ct.map(t => (
                          <div key={t} style={{ width: cellSz, fontSize: Math.max(7, Math.min(9, cellSz * 0.14)), color: '#aaa', fontWeight: 700,
                            textAlign: 'center', paddingBottom: 4, overflow: 'hidden', fontFamily: "'JetBrains Mono',monospace" }}>{t}</div>
                        ))}
                      </div>
                      {ct.map((t1, i) => (
                        <div key={t1} style={{ display: 'flex', alignItems: 'center', marginBottom: 1 }}>
                          <div style={{ width: lblW, fontSize: Math.max(7, Math.min(9, lblW * 0.14)), color: '#aaa', fontWeight: 700,
                            textAlign: 'right', paddingRight: 6, overflow: 'hidden', whiteSpace: 'nowrap',
                            fontFamily: "'JetBrains Mono',monospace", flexShrink: 0 }}>{t1}</div>
                          {ct.map((t2, j) => {
                            const v = matrix[i][j];
                            const isDiag = i === j;
                            return (
                              <div key={t2} title={`${t1} / ${t2}: ${isNaN(v) ? 'N/A' : v.toFixed(3)}`}
                                style={{
                                  width: cellSz, height: cellSz, background: corrCellColor(v),
                                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                                  fontSize: Math.max(7, Math.min(10, cellSz * 0.16)),
                                  color: isDiag ? '#fff' : '#ddd',
                                  fontWeight: isDiag ? 800 : 500,
                                  fontFamily: "'JetBrains Mono',monospace",
                                  borderRadius: 2, margin: '0 0.5px', cursor: 'default',
                                  border: isDiag ? '1px solid #ffffff33' : 'none',
                                  opacity: isNaN(v) ? 0.3 : 1
                                }}
                                onMouseOver={e => e.currentTarget.style.filter = 'brightness(1.3)'}
                                onMouseOut={e => e.currentTarget.style.filter = ''}>
                                {isNaN(v) ? '—' : v.toFixed(2)}
                              </div>
                            );
                          })}
                        </div>
                      ))}
                    </div>
                    {/* Vertical legend to the right of the matrix */}
                    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, paddingTop: 23, flexShrink: 0 }}>
                      <span style={{ fontSize: 9, color: '#555' }}>+1.0</span>
                      <div style={{
                        width: 10, height: matrixH, borderRadius: 4,
                        background: 'linear-gradient(180deg,#176b3a 0%,#2a2a2a 50%,#c41a1a 100%)'
                      }} />
                      <span style={{ fontSize: 9, color: '#555' }}>–1.0</span>
                    </div>
                  </div>;
                })()}
              </div>
            </>}
          </div>
        </div>, document.body
      );
    }

    /* ── Save Modal ── */
    function SaveModal({ filters, onClose }) {
      const [name, setName] = useState('');
      const [saved, setSaved] = useState([]);
      useEffect(() => { try { setSaved(JSON.parse(localStorage.getItem('st_saved_filters') || '[]')); } catch { }; }, []);
      const handleSave = () => {
        if (!name.trim()) return;
        const updated = [...saved.filter(s => s.name !== name.trim()), { name: name.trim(), filters }];
        localStorage.setItem('st_saved_filters', JSON.stringify(updated));
        setSaved(updated); setName('');
      };
      return createPortal(
        <div style={{ position: 'fixed', inset: 0, background: '#000a', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 200 }}>
          <div style={{ background: '#161616', border: '1px solid #2a2a2a', borderRadius: 6, padding: 20, width: 360, maxHeight: '70vh', display: 'flex', flexDirection: 'column' }}>
            <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 12 }}>Saved Filters</div>
            <div style={{ display: 'flex', gap: 6, marginBottom: 12 }}>
              <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="Filter set name…"
                style={{ flex: 1 }} onKeyDown={e => e.key === 'Enter' && handleSave()} />
              <button onClick={handleSave} style={{ background: '#f0a500', color: '#000', padding: '5px 12px', borderRadius: 3, fontWeight: 600, fontSize: 12 }}>Save</button>
            </div>
            <div style={{ flex: 1, overflow: 'auto' }}>
              {saved.length === 0 && <div style={{ color: '#444', fontSize: 11, textAlign: 'center', padding: 12 }}>No saved filters</div>}
              {saved.map(s => <div key={s.name} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '6px 0', borderBottom: '1px solid #1a1a1a' }}>
                <span style={{ flex: 1, fontSize: 12, color: '#aaa' }}>{s.name}</span>
                <button onClick={() => onClose(s.filters)} style={{ background: '#1a1a1a', color: '#f0a500', padding: '3px 8px', borderRadius: 3, fontSize: 11 }}>Load</button>
                <button onClick={() => { const u = saved.filter(x => x.name !== s.name); localStorage.setItem('st_saved_filters', JSON.stringify(u)); setSaved(u); }}
                  style={{ background: 'none', color: '#555', fontSize: 13, padding: '2px 6px' }}>✕</button>
              </div>)}
            </div>
            <button onClick={() => onClose(null)} style={{ marginTop: 12, background: '#1a1a1a', color: '#888', padding: '6px', borderRadius: 3, fontSize: 12, width: '100%' }}>Close</button>
          </div>
        </div>, document.body
      );
    }

    /* ── Header ── */
    function Header({ user, universeStatus, onLogout }) {
      const { loaded = 0, total = 0, fresh = 0 } = universeStatus || {};
      const pct = total > 0 ? Math.round(loaded / total * 100) : 0;
      const isLoading = loaded < total;
      return <div style={{
        height: 44, background: '#111', borderBottom: '1px solid #1a1a1a',
        display: 'flex', alignItems: 'center', padding: '0 16px', gap: 12, flexShrink: 0
      }}>
        <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 14, fontWeight: 700, color: '#ffffff', letterSpacing: 1 }}>▲ SWING TRADER</span>
        <div style={{ width: 1, height: 20, background: '#222' }} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <span style={{ fontSize: 11, color: isLoading ? '#f0a500' : '#444' }}>
            {isLoading ? `Loading universe… ${loaded}/${total} (${pct}%)` :
              `${loaded} stocks loaded`}
          </span>
          {isLoading && <span style={{ display: 'inline-block', width: 60, height: 4, background: '#1a1a1a', borderRadius: 2, overflow: 'hidden' }}>
            <span style={{ display: 'block', width: pct + '%', height: '100%', background: '#f0a500', transition: 'width .5s' }} />
          </span>}
          {!isLoading && universeStatus?.last_updated_time && (
            <span style={{ fontSize: 10, color: '#555', marginLeft: 8 }}>
              Data as of {universeStatus.last_updated_time}
            </span>
          )}
        </div>
        <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 10 }}>
          <span style={{ fontSize: 11, color: '#555' }}>{user?.username}</span>
          <button onClick={onLogout} style={{ background: '#1a1a1a', color: '#555', padding: '4px 10px', borderRadius: 3, fontSize: 11 }}>Logout</button>
        </div>
      </div>;
    }

      const countScore = () => [f.score_min, f.score_f_min, f.score_t_min, f.score_m_min].filter(v => v !== '' && v != null).length;
      const countPort = () => [f.beta_min, f.beta_max, f.div_min, f.div_max].filter(v => v !== '' && v != null).length;

      return <div style={{ width: 220, flexShrink: 0, background: '#111', borderRight: '1px solid #1a1a1a', overflow: 'auto' }}>
        <div style={{
          padding: '8px 12px', fontSize: 10, color: '#444', textTransform: 'uppercase', letterSpacing: .5,

        }}>FILTERS</div>
        <div style={{ padding: '6px 12px' }}>

                    }}>
                    {lbl}
                  </button>

              </div>
            </div>
            <div style={{ marginBottom: 6 }}>
              <div style={{ fontSize: 10, color: '#666', marginBottom: 3 }}>
